name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Balance snapshot (300 AI games)
        run: npm run sim -- 300 | tee sim.json
      - name: Build (GitHub Pages path)
        run: BASE_PATH="/${{ github.event.repository.name }}/" npm run build
      - name: Build single-file (for Add to Home Screen / artifacts)
        run: SINGLEFILE=1 npx vite build --outDir dist-single
      - uses: actions/upload-artifact@v4
        with: { name: megacity-single-file, path: dist-single/index.html }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
